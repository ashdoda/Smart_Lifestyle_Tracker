<!DOCTYPE html>
<!-- Practitioner page: add a patient -->

<html lang="en" data-theme="sage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Provider: add patients - Lifestyle Tracker prototype</title>
<meta name="theme-color" content="#EEF1EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifestyle Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<script>try{var t=JSON.parse(localStorage.getItem('hk.theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<!-- Style files (fonts, colours and the look of each part of the app) -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/themes.css">

<link rel="stylesheet" href="css/pet.css">
<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/week.css">
</head>
<body data-page="provider-add.html">
<!-- Empty box. The scripts below draw the whole page in here -->
<div id="app"></div>
<!-- Script files, loaded in this order. Each one adds a piece of the app -->
<script src="js/hk-data.js"></script>
<script src="js/hk-boot.js"></script>

<script src="js/core.js"></script>
